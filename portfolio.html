                        ? list(LIKED_LINKS.map((l, i) => ['link-' + i, l.title, l.tag || '', hostOf(l.url)]))
                        : '<p class="note">coming soon.</p>'}
                </section>`;

        // old links (#core, #knowledge, #til) open the stl page on the right tab
        const HASH_ALIASES = { core: ['stl', 'core'], knowledge: ['stl', 'knowledge'], til: ['stl', 'til'], links: ['pickups', 'links'] };

        // stl → tab contents
        const STL_CORE = `
                <section class="block">
                    <p class="note">coming soon.</p>
                </section>`;
        // stl → "today i learned" tab: filled from til/index.json (built from til/*.md on deploy)
        const STL_TIL = `
                <div class="til-box" data-scope="technical"><p class="note">loading …</p></div>`;
        function tabsHtml(page) {
            const t = TABS[page];
            return `<div class="subnav"><div class="tabs" role="tablist">` +
                t.list.map(([id, label]) => `<button role="tab" data-tab="${id}" aria-selected="${t.current === id}">${label}</button>`).join('') +
                `</div></div>`;
        }

        // a row in the middle list: [item id, title, meta, subtitle]
        const VIEWS = {
            hello: () => `
                <h1 class="handle">selam, hello, hallo!</h1>
                ${tabsHtml('hello')}
                ${TABS.hello.current === 'brief' ? HELLO_BRIEF : HELLO_LONG}`,

            cv: () => `
                <h1 class="handle">uğur altınışık</h1>
                ${tabsHtml('cv')}
                ${TABS.cv.current === 'short' ? CV_SHORT : CV_LONG}`,

            stl: () => `
                <h1 class="handle">standard technical library</h1>
                ${tabsHtml('stl')}
                ${{ core: STL_CORE, knowledge: STL_KNOWLEDGE(), til: STL_TIL }[TABS.stl.current]}`,

            records: () => `
                <h1 class="handle">records</h1>
                ${tabsHtml('records')}
                ${TABS.records.current === 'til'
                    ? '<div class="til-box" data-scope="all"><p class="note">loading …</p></div>'
                    : '<section class="block"><p class="note">coming soon.</p></section>'}`,

            pickups: () => `
                <h1 class="handle">pickups</h1>
                ${tabsHtml('pickups')}
                ${TABS.pickups.current === 'follow' ? PICKUPS_FOLLOW : PICKUPS_LINKS()}`,

            'say-hello': () => `
                <div class="eyebrow">say 'hello altnskuur!'</div>
                <h1 class="page-title">leave a note</h1>
                <section class="block">
                    <p>a guestbook is coming. until then, the fastest way is email:</p>
                    <p><a class="inline-open" href="mailto:m.altinisiku@gmail.com">m.altinisiku@gmail.com</a></p>
                </section>`
        };

        // every liked link gets its own right-panel card
        function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
        LIKED_LINKS.forEach((l, i) => {
            ITEMS['link-' + i] = {
                kicker: 'links i liked' + (l.tag ? ' · ' + l.tag : ''),
                title: l.title,
                body: `<p>${l.why || ''}</p><p class="note">${hostOf(l.url)}</p>`,
                link: { href: l.url, label: 'visit' }
            };
        });

        // right panel stays empty until something is clicked
        const DEFAULT_PANEL = '';

        /* ==================================================================
           RENDER (no content below this line)
           ================================================================== */
        const $nav = document.getElementById('nav');
        const $view = document.getElementById('view');
        const $panel = document.getElementById('panel');
        const $backdrop = document.getElementById('backdrop');
        let selected = null;

        function list(rows) {
            return '<ul class="list">' + rows.map(([id, title, meta, sub]) => `
                <li><button class="item" data-open="${id}">
                    <span class="item-title">${title}</span>
                    <span class="item-meta">${meta || ''}</span>
                    ${sub ? `<span class="item-sub">${sub}</span>` : ''}
                </button></li>`).join('') + '</ul>';
        }

        function nowWord([text, id]) {
            return id ? `<button class="inline-open" data-open="${id}">${text}</button>` : `<span class="plain">${text}</span>`;
        }

        function nowList() {
            return '<dl class="kv">' + NOW.map(([label, words]) => `
                <dt>${label}</dt>
                <dd><span class="rotator" data-words='${JSON.stringify(words).replace(/'/g, '&#39;')}'>${nowWord(words[0])}</span></dd>`
            ).join('') + '</dl>';
        }

        // swap the words every ROTATE_EVERY ms (fade out → swap → fade in)
        let rotateTimers = [];
        function startRotators() {
            rotateTimers.forEach(clearInterval);
            rotateTimers = [];
            document.querySelectorAll('.rotator').forEach(el => {
                const words = JSON.parse(el.dataset.words);
                if (words.length < 2) return;
                let i = 0;
                rotateTimers.push(setInterval(() => {
                    el.classList.add('out');
                    setTimeout(() => {
                        i = (i + 1) % words.length;
                        el.innerHTML = nowWord(words[i]);
                        markSelected();
                        el.classList.remove('out');
                    }, 250);
                }, ROTATE_EVERY));
            });
        }

        function renderNav(active) {
            $nav.innerHTML = NAV.map(n => n.href
                ? `<a href="${n.href}" class="nav-ext">${n.label}</a>`
                : `<a href="#${n.id}" class="${n.id === active ? 'active' : ''}" ${n.id === active ? 'aria-current="page"' : ''}>${n.label}</a>`
            ).join('');
        }

        const CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

        const isNarrow = () => window.innerWidth <= 1180;
        function openPanel(id) {
            const it = ITEMS[id];
            if (!it) return;
            selected = id;
            if (it.kn) {
                revealKnowledge(it.kn);                         // text opens under the title
                if (isNarrow()) { $panel.classList.remove('open'); $backdrop.classList.remove('show'); return; }
            }
            $panel.classList.remove('is-default');
            $panel.innerHTML = `
                <article class="panel-card">
                    <header class="panel-head">
                        <div class="titles">
                            <div class="panel-kicker">${it.kicker || ''}</div>
                            <h2 class="panel-title">${it.title}</h2>
                        </div>
                        <button class="panel-close" id="panel-close" aria-label="close">${CLOSE_ICON}</button>
                    </header>
                    ${it.tags ? `<div class="tags">${it.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
                    <div class="panel-body">${it.body}</div>
                    ${it.link ? `<a class="btn" href="${it.link.href}" target="_blank" rel="noopener noreferrer">${it.link.label} ↗</a>` : ''}
                </article>`;
            $panel.classList.add('open');
            $backdrop.classList.add('show');
            markSelected();
            document.getElementById('panel-close').focus({ preventScroll: true });
        }

        function closePanel() {
            const wasKnowledge = selected && ITEMS[selected] && ITEMS[selected].kn;
            selected = null;
            if (wasKnowledge) { kn.article = null; renderKnowledge(); }
            $panel.classList.remove('open');
            $backdrop.classList.remove('show');
            $panel.classList.add('is-default');
            $panel.innerHTML = DEFAULT_PANEL;
            markSelected();
        }

        function markSelected() {
            document.querySelectorAll('[data-open]').forEach(b => b.classList.toggle('selected', b.dataset.open === selected && b.classList.contains('item')));
        }

        function afterRender() {
            startRotators();
            if (currentView === 'stl' && TABS.stl.current === 'knowledge') loadKnowledge();
            if (document.querySelector('.til-box')) loadTil();      // stl → til (technical) and records → til (all)
        }

        /* ---------- knowledge library (Notion → knowledge/*.md → here) ---------- */
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        let knowledgeIndex = null;
        const kn = {
            byId: {}, bySlug: {}, kids: {},   // tree built from index.json
            expanded: new Set(),              // parents whose children are visible (arrow open)
            article: null,                    // slug whose text is open under its title
            html: {}                          // rendered markdown cache
        };
        const CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

        function prettyDate(iso) {
            if (!iso) return '';
            const d = new Date(iso.length === 10 ? iso + 'T12:00:00Z' : iso);
            return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toLowerCase();
        }
        const editedOf = it => it.edited || it.updated || '';

        async function loadKnowledge() {
            const box = document.getElementById('kn-list');
            if (!box) return;
            try {
                if (!knowledgeIndex) {
                    const r = await fetch('knowledge/index.json', { cache: 'no-cache' });
                    if (!r.ok) throw new Error(r.status);
                    knowledgeIndex = await r.json();
                    buildKnowledge(knowledgeIndex.items || []);
                }
            } catch (e) {
                box.innerHTML = location.protocol === 'file:'
                    ? '<p class="note">the library opens on the live site (altnskuur.github.io).</p>'
                    : '<p class="note">coming soon.</p>';
                return;
            }
            renderKnowledge();
        }

        function buildKnowledge(items) {
            items.forEach(it => { kn.byId[it.id] = it; kn.bySlug[it.slug] = it; });
            items.forEach(it => {
                const p = it.parent && kn.byId[it.parent] ? it.parent : 'root';
                (kn.kids[p] = kn.kids[p] || []).push(it);
            });
            // newest first: a parent counts as "edited" when anything under it was
            const latest = it => [editedOf(it)].concat((kn.kids[it.id] || []).map(latest)).sort().pop();
            items.forEach(it => { it._latest = latest(it); });
            Object.values(kn.kids).forEach(list => list.sort((a, b) => b._latest.localeCompare(a._latest)));

            items.forEach(it => {
                const d = (it.domain || 'other').toLowerCase();
                ITEMS['kn-' + it.slug] = {
                    kn: it.slug,
                    kicker: ['knowledge'].concat(it.path || []).map(esc).join(' › '),
                    title: esc(it.title),
                    tags: [esc(d)],
                    body: (it.summary ? `<p>${esc(it.summary)}</p>` : '<p class="note">no summary yet.</p>') +
                          `<p class="kn-edited">last edited ${esc(prettyDate(editedOf(it)))}</p>` + subPagesHtml(it)
                };
            });
        }

        // "sub-pages" list in the right panel (clicking one opens it in the list)
        function subPagesHtml(it) {
            const list = kn.kids[it.id] || [];
            if (!list.length) return '';
            return '<div class="kn-sub"><div class="kn-sub-title">sub-pages</div><ul class="list">' +
                list.map(c => `<li><button class="item" data-open="kn-${esc(c.slug)}"><span class="item-title">${esc(c.title)}</span><span class="item-meta">→</span></button></li>`).join('') +
                '</ul></div>';
        }

        function nodeHtml(it, lvl) {
            const children = kn.kids[it.id] || [];
            const open = kn.expanded.has(it.slug);
            const caret = children.length
                ? `<button class="kn-caret${open ? ' open' : ''}" data-toggle="${esc(it.slug)}" aria-expanded="${open}" aria-label="${open ? 'hide' : 'show'} sub-pages">${CARET}</button>`
                : '<span class="kn-caret-space"></span>';
            const article = kn.article === it.slug
                ? `<div class="kn-article md-body" id="kn-art-${esc(it.slug)}">${kn.html[it.slug] || '<p class="note">loading …</p>'}${narrowMeta(it)}</div>`
                : '';
            return `<li class="kn-node" style="--lvl:${lvl}">
                    <div class="kn-line">
                        ${caret}
                        <button class="item kn-row" data-open="kn-${esc(it.slug)}" aria-expanded="${kn.article === it.slug}">
                            <span class="item-title">${esc(it.title)}</span>
                            <span class="item-sub">last edited ${esc(prettyDate(editedOf(it)))}</span>
                        </button>
                    </div>
                    ${article}
                    ${open && children.length ? '<ul class="kn-children">' + children.map(c => nodeHtml(c, lvl + 1)).join('') + '</ul>' : ''}
                </li>`;
        }

        // on narrow screens there's no side panel: summary + sub-pages go under the article instead
        function narrowMeta(it) {
            return `<div class="kn-meta-inline">${it.summary ? `<p>${esc(it.summary)}</p>` : ''}${subPagesHtml(it)}</div>`;
        }

        function renderKnowledge() {
            const box = document.getElementById('kn-list');
            if (!box || !knowledgeIndex) return;
            const roots = kn.kids.root || [];
            if (!roots.length) { box.innerHTML = '<p class="note">coming soon.</p>'; return; }
            // Domain groups, newest group first
            const groups = [];
            roots.forEach(it => {
                const d = (it.domain || 'other').toLowerCase();
                let g = groups.find(x => x.name === d);
                if (!g) groups.push(g = { name: d, items: [] });
                g.items.push(it);
            });
            box.innerHTML = groups.map(g => `
                <section class="block">
                    <h2>${esc(g.name)}</h2>
                    <ul class="kn-tree">${g.items.map(it => nodeHtml(it, 0)).join('')}</ul>
                </section>`).join('');
            markSelected();
            if (kn.article) loadArticle(kn.article);
        }

        // show a page: open its parents' arrows, open its text, scroll to it
        function revealKnowledge(slug) {
            let it = kn.bySlug[slug];
            for (let p = it && it.parent && kn.byId[it.parent]; p; p = p.parent && kn.byId[p.parent]) kn.expanded.add(p.slug);
            kn.article = slug;
            renderKnowledge();
            const row = document.querySelector(`.kn-row[data-open="kn-${CSS.escape(slug)}"]`);
            if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // markdown → html: marked + DOMPurify + KaTeX, loaded only when a page is opened
        const LIBS = {
            js: ['https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js',
                 'https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js',
                 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js'],
            css: 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'
        };
        let libsReady = null;
        function loadLibs() {
            if (libsReady) return libsReady;
            const css = document.createElement('link');
            css.rel = 'stylesheet'; css.href = LIBS.css;
            document.head.appendChild(css);
            libsReady = LIBS.js.reduce((p, src) => p.then(() => new Promise((ok, fail) => {
                const sc = document.createElement('script');
                sc.src = src; sc.onload = ok; sc.onerror = fail;
                document.head.appendChild(sc);
            })), Promise.resolve());
            libsReady.catch(() => { libsReady = null; });
            return libsReady;
        }

        function renderMarkdown(md) {
            // 1) park code so math detection can't touch it
            const code = [];
            md = md.replace(/```[\s\S]*?```|`[^`\n]+`/g, m => { code.push(m); return '\u0000C' + (code.length - 1) + '\u0000'; });
            // 2) pull out math ($$block$$ and $inline$)
            const math = [];
            md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) => { math.push([tex, true]); return '@@MATH' + (math.length - 1) + '@@'; });
            md = md.replace(/\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (m, tex) => { math.push([tex, false]); return '@@MATH' + (math.length - 1) + '@@'; });
            // 3) put code back, render markdown, sanitize
            md = md.replace(/\u0000C(\d+)\u0000/g, (m, i) => code[+i]);
            let html = DOMPurify.sanitize(marked.parse(md));
            // 4) render math
            html = html.replace(/@@MATH(\d+)@@/g, (m, i) => {
                const [tex, display] = math[+i];
                try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
                catch (e) { return esc(tex); }
            });
            return html;
        }

        // the page text, opened under its title in the middle column
        async function loadArticle(slug) {
            if (kn.html[slug]) return;
            const it = kn.bySlug[slug];
            try {
                const [r] = await Promise.all([fetch(it.file, { cache: 'no-cache' }), loadLibs()]);
                if (!r.ok) throw new Error(r.status);
                kn.html[slug] = renderMarkdown(await r.text());
            } catch (e) {
                kn.html[slug] = '<p class="note">couldn\'t load this page right now.</p>';
                setTimeout(() => { delete kn.html[slug]; }, 0);   // try again next time it's opened
            }
            const box = document.getElementById('kn-art-' + slug);
            if (box && kn.article === slug) {
                box.innerHTML = kn.html[slug] + narrowMeta(it);
                box.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
            }
        }

        /* ---------- today i learned ----------
           notes live in til/<number>_<name>.md (first line after the front matter = header).
           every note shows under records → til; notes with "technical: true" also under stl → til.
           list source: til/index.json (built on deploy) → fallback: ask GitHub which files are in til/ */
        const TIL_REPO = 'altnskuur/altnskuur.github.io';
        const til = { entries: null, open: null, html: {} };

        // "---\ntechnical: true\n---\n# header\nbody"  →  { meta, header, body }
        function parseTil(text) {
            let lines = text.replace(/\r/g, '').split('\n');
            const meta = {};
            if (lines[0] && lines[0].trim() === '---') {
                const end = lines.indexOf('---', 1);
                if (end > 0) {
                    lines.slice(1, end).forEach(l => { const i = l.indexOf(':'); if (i > 0) meta[l.slice(0, i).trim().toLowerCase()] = l.slice(i + 1).trim().replace(/^['"]|['"]$/g, ''); });
                    lines = lines.slice(end + 1);
                }
            }
            while (lines.length && !lines[0].trim()) lines.shift();
            const header = lines.length ? lines.shift().replace(/^#+\s*/, '').trim() : '';
            return { meta, header, body: lines.join('\n').trim() };
        }
        const tilUrl = file => 'til/' + encodeURIComponent(file);       // "#1_x.md" needs %23
        const isTrue = v => /^(true|yes|1|on)$/i.test(v || '');

        async function tilFromIndex() {
            const r = await fetch('til/index.json', { cache: 'no-cache' });
            if (!r.ok) throw new Error(r.status);
            return (await r.json()).entries || [];
        }

        // no index.json yet: ask GitHub for the file list (cached 10 min), read each file from this site
        async function tilFromGitHub() {
            let names = null;
            try { const c = JSON.parse(sessionStorage.getItem('til-files') || 'null'); if (c && Date.now() - c.at < 600000) names = c.names; } catch (e) { }
            if (!names) {
                const r = await fetch(`https://api.github.com/repos/${TIL_REPO}/contents/til`);
                if (r.status === 404) return [];                         // no til folder yet
                if (!r.ok) throw new Error(r.status);
                names = (await r.json()).filter(f => f.type === 'file').map(f => f.name);
                try { sessionStorage.setItem('til-files', JSON.stringify({ at: Date.now(), names })); } catch (e) { }
            }
            const files = names.filter(n => /\.md$/i.test(n) && !n.startsWith('_') && /^#?\d+/.test(n));
            const entries = await Promise.all(files.map(async name => {
                const r = await fetch(tilUrl(name), { cache: 'no-cache' });
                if (!r.ok) return null;
                const { meta, header } = parseTil(await r.text());
                const m = name.match(/^#?(\d+)[_\- ]?(.*)\.md$/i);
                return { n: +m[1], title: header || m[2] || name, technical: isTrue(meta.technical), file: name };
            }));
            return entries.filter(Boolean).sort((a, b) => b.n - a.n);
        }

        async function loadTil() {
            if (!til.entries) {
                try { til.entries = await tilFromIndex(); }
                catch (e) {
                    try { til.entries = await tilFromGitHub(); }
                    catch (e2) {
                        document.querySelectorAll('.til-box').forEach(box => {
                            box.innerHTML = location.protocol === 'file:'
                                ? '<p class="note">today i learned opens on the live site (altnskuur.github.io).</p>'
                                : '<p class="note">couldn\'t load the notes right now. try again in a bit.</p>';
                        });
                        return;
                    }
                }
            }
            renderTil();
        }

        function renderTil() {
            if (!til.entries) return;
            document.querySelectorAll('.til-box').forEach(box => {
                const list = box.dataset.scope === 'technical' ? til.entries.filter(e => e.technical) : til.entries;
                if (!list.length) { box.innerHTML = '<p class="note">coming soon.</p>'; return; }
                box.innerHTML = '<ol class="til-list">' + list.map(e => {
                    const open = til.open === e.file;
                    return `<li>
                        <button class="til-row${open ? ' open' : ''}" data-til="${esc(e.file)}" aria-expanded="${open}">#${e.n}_${esc(e.title)}</button>
                        ${open ? `<div class="til-text md-body">${til.html[e.file] || '<p class="note">loading …</p>'}</div>` : ''}
                    </li>`;
                }).join('') + '</ol>';
            });
            if (til.open && !til.html[til.open]) loadTilText(til.open);
        }

        // photos / links written relative to the note ("images/belgrade.jpg") point into til/
        function fixRelativePaths(html, folder) {
            const box = document.createElement('div');
            box.innerHTML = html;
            const base = new URL(folder, location.href);
            box.querySelectorAll('img[src], a[href]').forEach(el => {
                const attr = el.tagName === 'IMG' ? 'src' : 'href';
                const v = el.getAttribute(attr);
                if (!v || /^([a-z]+:|\/|#)/i.test(v)) return;        // absolute, root or #anchor: leave as is
                el.setAttribute(attr, new URL(v, base).href);
            });
            box.querySelectorAll('img').forEach(img => { img.loading = 'lazy'; });
            box.querySelectorAll('a[href^="http"]').forEach(a => { if (!a.href.startsWith(location.origin)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } });
            return box.innerHTML;
        }

        async function loadTilText(file) {
            try {
                const [r] = await Promise.all([fetch(tilUrl(file), { cache: 'no-cache' }), loadLibs()]);
                if (!r.ok) throw new Error(r.status);
                const { body } = parseTil(await r.text());         // front matter + header are not repeated
                til.html[file] = fixRelativePaths(renderMarkdown(body), 'til/') || '<p class="note">nothing written yet.</p>';
            } catch (e) {
                til.html[file] = '<p class="note">couldn\'t load this note right now.</p>';
                setTimeout(() => { delete til.html[file]; }, 0);
            }
            if (til.open === file) renderTil();
        }

        let currentView = 'hello';
        function route() {
            let id = (location.hash || '#hello').slice(1);
            if (HASH_ALIASES[id]) { TABS[HASH_ALIASES[id][0]].current = HASH_ALIASES[id][1]; id = HASH_ALIASES[id][0]; }
            const view = VIEWS[id] ? id : 'hello';
            currentView = view;
            renderNav(view);
            // on phones the nav is one scrolling row: keep the active item visible
            if (window.innerWidth <= 720) { const act = $nav.querySelector('.active'); if (act) $nav.scrollLeft = act.offsetLeft - 16; }
            $view.innerHTML = VIEWS[view]();
            afterRender();
            closePanel();
            document.title = (view === 'hello' ? 'Uğur Altınışık' : NAV.find(n => n.id === view).label + ' · Uğur Altınışık');
        }

        // clicks in the middle → right panel
        $view.addEventListener('click', e => {
            const tab = e.target.closest('[data-tab]');
            if (tab) {
                TABS[currentView].current = tab.dataset.tab;
                $view.innerHTML = VIEWS[currentView]();
                afterRender();
                closePanel();
                return;
            }
            const day = e.target.closest('[data-til]');
            if (day) {                                          // today i learned: open / close a note under its header
                til.open = til.open === day.dataset.til ? null : day.dataset.til;
                renderTil();
                return;
            }
            const caret = e.target.closest('[data-toggle]');
            if (caret) {                                        // arrow: show / hide sub-pages only
                const slug = caret.dataset.toggle;
                kn.expanded.has(slug) ? kn.expanded.delete(slug) : kn.expanded.add(slug);
                renderKnowledge();
                return;
            }
            const b = e.target.closest('[data-open]');
            if (!b) return;
            if (selected === b.dataset.open) closePanel(); else openPanel(b.dataset.open);
        });
        $panel.addEventListener('click', e => {
            if (e.target.closest('#panel-close')) return closePanel();
            const b = e.target.closest('[data-open]');          // sub-pages open in the same panel
            if (b) openPanel(b.dataset.open);
        });
        $backdrop.addEventListener('click', closePanel);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
        window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

        // theme toggle: moon in light mode, sun in dark mode
        const $toggle = document.getElementById('theme-toggle');
        const darkQuery = matchMedia('(prefers-color-scheme: dark)');
        function isDark() {
            const t = document.documentElement.dataset.theme;
            return t ? t === 'dark' : darkQuery.matches;
        }
        function syncToggle() {
            const dark = isDark();
            $toggle.classList.toggle('is-dark', dark);
            const label = dark ? 'switch to light mode' : 'switch to dark mode';
            $toggle.title = label;
            $toggle.setAttribute('aria-label', label);
        }
        $toggle.addEventListener('click', () => {
            document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
            try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) { }
            syncToggle();
        });
        darkQuery.addEventListener('change', syncToggle);   // follows the system setting until the visitor picks one
        syncToggle();

        route();
    })();
    </script>
</body>

</html>
