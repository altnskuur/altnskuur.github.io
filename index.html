<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğur Altınışık — Software Engineer</title>
    <meta name="description" content="Uğur Altınışık — Software Engineer working on embedded Linux and firmware. Portfolio, experience and projects.">
    <meta name="author" content="Uğur Altınışık">
    <meta name="theme-color" content="#111111">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="profile.jpg">

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://altnskuur.github.io/">
    <meta property="og:title" content="Uğur Altınışık — Software Engineer">
    <meta property="og:description" content="Embedded Linux & firmware engineer. Portfolio, experience and projects.">
    <meta property="og:image" content="https://altnskuur.github.io/profile.jpg">
    <meta name="twitter:card" content="summary">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #111111;
            --fg: #c8c8c8;
            --muted: #8a8a8a;
            --bright: #ededed;
            --user: #7cc36e;
            --host: #5f8fd6;
            --err: #e06c6c;
            --accent: #d7b46a;
            --font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        .terminal {
            max-width: 860px;
            min-height: 100%;
            padding: 3rem 1.5rem 4rem;
            cursor: text;
        }

        .line { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; }
        .muted { color: var(--muted); }
        .bright { color: var(--bright); }
        .err { color: var(--err); }
        .user { color: var(--user); }
        .host { color: var(--host); }

        a { color: var(--host); }
        a:hover { color: var(--accent); }

        .help-row { display: grid; grid-template-columns: 17ch 1fr; gap: 1ch; }

        .input-line { display: flex; align-items: baseline; }
        .prompt { white-space: pre; flex-shrink: 0; }
        #cmd {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--bright);
            font: inherit;
            caret-color: var(--bright);
            margin-left: 1ch;
        }

        noscript p { margin-top: 1rem; }

        @media (max-width: 600px) {
            body { font-size: 13px; }
            .terminal { padding: 1.5rem 1rem 3rem; }
            .help-row { grid-template-columns: 1fr; gap: 0; margin-bottom: 0.35rem; }
            .help-row .muted { padding-left: 2ch; }
            #cmd { font-size: 16px; } /* stops iOS from zooming on focus */
        }
    </style>
</head>

<body>
    <main class="terminal" id="terminal" aria-label="Interactive terminal">
        <div id="output" aria-live="polite"></div>
        <div class="input-line">
            <span class="prompt" id="prompt"><span class="user">visitor</span><span class="muted">@</span><span class="host">altnskuur.github.io</span><span class="muted">:~$</span></span>
            <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                aria-label="Type a command" autofocus>
        </div>
        <noscript>
            <p>javascript is off, so the terminal is asleep. <a href="portfolio.html">go straight to the portfolio →</a></p>
        </noscript>
    </main>

    <script>
        (function () {
            const out = document.getElementById('output');
            const input = document.getElementById('cmd');
            const term = document.getElementById('terminal');

            const UI_CMD = '.\\altnskuur.ui';
            const HELP_CMD = 'terminal --help';
            const LINKS = {
                github: 'https://github.com/altnskuur',
                linkedin: 'https://www.linkedin.com/in/altnskuur/',
                email: 'mailto:m.altinisiku@gmail.com'
            };

            // ---------- tiny file system ----------
            // folders you can cd into, and the files inside them (cat <file>)
            const FS = {
                'hello-world': {
                    'brief.md': "# brief\n\n## who am i\ni was born in 2000, so you decide how old i am. 26? 27? i don't know either. i was born in konya and i'm from tire/izmir, but i've lived in ankara since 2002. what a cultural chaos. i love cooking and eating, and i'm sure i'll open a restaurant someday. i'm a 1-star cmas diver. i even bought a camera for it, and now i have to enjoy recording my life with it.\n\n## what i did\ni enrolled at tobb etü in 2018 with a full scholarship. back then, i felt like i was achieving a lot, but i learned it was nothing. i graduated with a 2.84/4.00 gpa (i know it's not great, but i'm trying to make up for it). i've worked at 3 companies as an embedded software engineer (2 of them during my student years), on defence industry projects. i really want to share them here, but you know, confidentiality issues.\n\n## what i'm doing\n- studying: toefl ibt, c++\n- building: altnskuur.github.io, cpp-hashlib\n- listening: 2026 (my spotify playlist)\n- watching: supernatural, true detective\n- reading: Bozkurt Mustafa Kemal, Zamanın Kısa Tarihi\n\n## what's next\ni miss academia so much. my next goal is a master's degree. i want to dive more, record my life more, cook more tasty food and deep dive into c++. who knows, maybe someday i'll dive at most of the popular dive spots, serve top-quality plates to my friends, attend cppcon, and bring my hands-on industry work and my academic work together.",
                    'autobiography.md': "# autobiography\n\ncoming soon."
                }
            };
            // every page of the ui is a folder too. a file = text, or a function that fetches text.
            // lazy(...) folders are filled from the site's own data the first time you open them.
            const lazy = load => ({ __lazy: load });
            Object.assign(FS, {
                stl: {
                    core: {},
                    knowledge: lazy(loadKnowledgeDir),
                    til: lazy(() => loadTilDir(e => e.technical))
                },
                records: {
                    collection: lazy(loadCollectionDir),
                    til: lazy(() => loadTilDir(e => e.personal !== false))
                },
                pickups: {
                    'things-i-follow.md': '# things i follow\n\ncoming soon.',
                    'links-i-liked.md': '# links i liked\n\ncoming soon.'
                },
                cv: {
                    'cv.md': "# cv\n\n## now\nSoftware Engineer · Meva Avionics (Nov. 2025 – present)\n\n## before\nCandidate Embedded Software Engineer · STM Defence (Dec. 2023 – Jun. 2024)\nPart-Time Engineer · SPECSON Design (Jan. 2022 – May 2023)\n\n## internship\nEmbedded Software Engineer Intern · STM Defence (May 2023 – Aug. 2023)\nElectrical and Electronics Engineer Intern · NERO Industry / NAVIO Technology (May 2021 – Sep. 2021)\n\n## education\nB.Sc. Electrical and Electronics Engineering · TOBB ETÜ (2018 – 2025)\n\n## code\nEmbedded C, C++, Python, MATLAB, Verilog\n\n## languages\nTurkish (native), English (professional), German (basic)\n\n## based in\nAnkara, Türkiye\n\n(the detailed cv: type 'open' here)"
                },
                'say-hello': {
                    'say-hello.md': "# say 'hello altnskuur!'\n\na guestbook is coming. until then, the fastest way is email:\nm.altinisiku@gmail.com\n\n(type 'email' to open your mail app)"
                }
            });
            // what 'open' shows in the ui for each folder
            const UI_OF = {
                '': 'portfolio.html', 'hello-world': 'portfolio.html',
                stl: 'portfolio.html#stl', 'stl/core': 'portfolio.html#core', 'stl/knowledge': 'portfolio.html#knowledge', 'stl/til': 'portfolio.html#til',
                records: 'portfolio.html#records', 'records/collection': 'portfolio.html#collection', 'records/til': 'portfolio.html#records',
                pickups: 'portfolio.html#pickups', cv: 'portfolio.html#cv', 'say-hello': 'portfolio.html#say-hello'
            };
            let cwd = '~';   // '~' or a folder path from FS, like 'stl/knowledge'
            const UI_FIRST = ['stl', 'records', 'pickups'];   // folders that look better in the ui

            // ---------- folders filled from the site's data ----------
            async function getJson(url) {
                const r = await fetch(url, { cache: 'no-cache' });
                if (!r.ok) throw new Error('http ' + r.status);
                return r.json();
            }
            async function getText(url) {
                const r = await fetch(url, { cache: 'no-cache' });
                if (!r.ok) throw new Error('http ' + r.status);
                return r.text();
            }
            // "Belgrad'da bir gün" → "belgrad-da-bir-gun"
            function slug(s) {
                return String(s).replace(/ı/g, 'i').replace(/İ/g, 'I').normalize('NFKD').replace(/[̀-ͯ]/g, '')
                    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'note';
            }
            function uniqueName(dir, name) {
                let n = name, i = 2;
                while (dir[n] !== undefined) n = name.replace(/\.md$/, '') + '-' + (i++) + '.md';
                return n;
            }
            function stripFrontMatter(text) {
                const m = text.replace(/\r/g, '').match(/^---\n[\s\S]*?\n---\n?/);
                return m ? text.replace(/\r/g, '').slice(m[0].length) : text;
            }
            function prettyWhen(iso) {
                if (!iso) return '';
                const d = new Date(iso.length === 10 ? iso + 'T12:00:00Z' : iso);
                if (isNaN(d)) return iso;
                const day = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toLowerCase();
                return iso.length > 10 ? day + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : day;
            }
            async function loadKnowledgeDir() {
                const dir = {};
                ((await getJson('knowledge/index.json')).items || []).forEach(it => {
                    dir[uniqueName(dir, slug(it.title) + '.md')] = async () => {
                        const body = await getText(it.file);
                        const crumbs = (it.path || []).concat(it.title).join(' › ');
                        return '# ' + it.title + '\n' + [crumbs, it.domain, 'last edited ' + prettyWhen(it.edited || it.updated)].filter(Boolean).join(' · ') +
                            (it.summary ? '\n\n' + it.summary : '') + '\n\n' + body.trim();
                    };
                });
                return dir;
            }
            async function loadTilDir(keep) {
                const dir = {};
                ((await getJson('til/index.json')).entries || []).filter(keep).forEach(e => {
                    dir[uniqueName(dir, e.n + '_' + slug(e.title) + '.md')] = async () => {
                        let body = stripFrontMatter(await getText('til/' + encodeURIComponent(e.file))).trim();
                        body = body.replace(/^#[^\n]*\n?/, '').trim();          // the header is printed below anyway
                        return '# #' + e.n + ' ' + e.title + (e.edited ? '\nlast edited ' + prettyWhen(e.edited) : '') + '\n\n' + body;
                    };
                });
                return dir;
            }
            async function loadCollectionDir() {
                const dir = {};
                ((await getJson('collection/index.json')).entries || []).forEach(e => {
                    const link = /^https?:/.test(e.link || '') ? e.link : (e.link ? new URL('collection/' + e.link, location.href).href : '');
                    dir[uniqueName(dir, e.n + '_' + slug(e.title) + '.md')] =
                        '# ' + e.title + (e.date ? '\n' + prettyWhen(e.date) : '') + (e.note ? '\n\n' + e.note : '') + (link ? '\n\n' + link : '');
                });
                return dir;
            }

            const history = [];
            let histIdx = 0;
            let misses = 0;

            // ---------- output helpers ----------
            function esc(s) {
                return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }
            function print(html, cls) {
                const div = document.createElement('div');
                div.className = 'line' + (cls ? ' ' + cls : '');
                div.innerHTML = html === '' ? '&nbsp;' : html;
                out.appendChild(div);
            }
            function blank() { print(''); }
            function cmdLink(c) {
                return '<span class="bright">' + esc(c) + '</span>';   // plain text: visitors type, they don't click
            }
            function promptHtml() {
                const path = cwd === '~' ? '~' : '~/' + cwd;
                return '<span class="user">visitor</span><span class="muted">@</span><span class="host">altnskuur.github.io</span><span class="muted">:' + esc(path) + '$</span>';
            }
            function echoPrompt(raw) {
                print(promptHtml() + ' <span class="bright">' + esc(raw) + '</span>');
            }
            function setCwd(dir) {
                cwd = dir;
                document.getElementById('prompt').innerHTML = promptHtml();
            }
            // print a .md file: headings bright, everything else as-is
            function printFile(text) {
                blank();
                const linkify = h => h.replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
                text.split('\n').forEach(l => print(/^#/.test(l) ? '<span class="bright">' + esc(l) + '</span>' : linkify(esc(l))));
                blank();
            }
            // "knowledge", "../records/til", "~/stl", "/cv" → ['stl', 'knowledge'] (relative to home; can't go above it)
            function resolvePath(arg) {
                const parts = /^[~\/]/.test(arg) || cwd === '~' ? [] : cwd.split('/');
                arg.replace(/^~\/?/, '').split('/').forEach(p => {
                    if (!p || p === '.') return;
                    if (p === '..') parts.pop();
                    else parts.push(p.toLowerCase());
                });
                return parts;
            }
            // walk the tree, filling lazy folders on the way → { dir } | { file } | null
            async function lookup(parts) {
                let node = FS;
                for (let i = 0; i < parts.length; i++) {
                    if (!node || typeof node !== 'object') return null;
                    let next = Object.prototype.hasOwnProperty.call(node, parts[i]) ? node[parts[i]] : undefined;
                    if (next === undefined) return null;
                    if (next && next.__lazy) next = node[parts[i]] = await next.__lazy();
                    if (typeof next !== 'object') return i === parts.length - 1 ? { file: next } : null;
                    node = next;
                }
                return { dir: node };
            }
            // already-loaded entries of a folder, for tab completion (never fetches)
            function peek(parts) {
                let node = FS;
                for (const p of parts) {
                    node = node && typeof node === 'object' && !node.__lazy ? node[p] : undefined;
                    if (!node || typeof node !== 'object' || node.__lazy) return null;
                }
                return node;
            }
            function entryNames(dir) {
                return Object.keys(dir).map(k => typeof dir[k] === 'object' ? k + '/' : k);
            }
            // a lazy folder can take a moment: show a line while it loads
            async function withLoading(label, work) {
                const line = document.createElement('div');
                line.className = 'line muted';
                line.textContent = label;
                const t = setTimeout(() => out.appendChild(line), 150);
                try { return await work(); }
                finally { clearTimeout(t); line.remove(); input.scrollIntoView({ block: 'nearest' }); }
            }
            const LOAD_ERR = "couldn't load that right now. (it works on the live site or a local server, not when the file is opened directly.)";

            // ---------- history.md: built live from the github repo ----------
            // versions = git tags (v0.0.0, v1.0.0 …), entries = commits on the default branch
            const REPO = 'altnskuur/altnskuur.github.io';
            const HISTORY_CACHE_KEY = 'history-md-v1';
            const HISTORY_TTL = 10 * 60 * 1000;   // reuse for 10 min (github allows 60 requests/hour per visitor)
            let historyLoading = false;

            function isHistory(arg) {
                return resolvePath(arg).join('/') === 'history.md';
            }
            function shortDate(iso) { return (iso || '').slice(0, 10); }

            async function loadHistory() {
                try {
                    const cached = JSON.parse(sessionStorage.getItem(HISTORY_CACHE_KEY) || 'null');
                    if (cached && Date.now() - cached.at < HISTORY_TTL) return cached.data;
                } catch (e) { }
                const api = 'https://api.github.com/repos/' + REPO;
                const [cRes, tRes] = await Promise.all([fetch(api + '/commits?per_page=100'), fetch(api + '/tags?per_page=100')]);
                if (!cRes.ok) throw new Error(cRes.status === 403 ? 'rate' : 'http ' + cRes.status);
                const commits = await cRes.json();
                const tags = tRes.ok ? await tRes.json() : [];
                const data = {
                    commits: commits.map(c => ({ sha: c.sha, date: shortDate(c.commit.author && c.commit.author.date), msg: (c.commit.message || '').split('\n')[0] })),
                    tags: tags.map(t => ({ name: t.name, sha: t.commit.sha }))
                };
                try { sessionStorage.setItem(HISTORY_CACHE_KEY, JSON.stringify({ at: Date.now(), data })); } catch (e) { }
                return data;
            }

            function printHistory(data) {
                const tagsBySha = {};
                data.tags.forEach(t => { (tagsBySha[t.sha] = tagsBySha[t.sha] || []).push(t.name); });
                blank();
                print('<span class="bright"># history</span>');
                print('<span class="muted">versions and commits from github.com/' + esc(REPO) + '</span>');
                let open = false;
                data.commits.forEach((c, i) => {
                    if (tagsBySha[c.sha]) {
                        blank();
                        print('<span class="bright">## ' + esc(tagsBySha[c.sha].join(', ')) + '</span> <span class="muted">· ' + esc(c.date) + '</span>');
                        open = true;
                    } else if (!open) {
                        blank();
                        print('<span class="bright">## unreleased</span>');
                        open = true;
                    }
                    print('- <span class="muted">' + esc(c.date) + '</span>  <span class="host">' + esc(c.sha.slice(0, 7)) + '</span>  ' + esc(c.msg));
                });
                if (!data.commits.length) print('no commits yet.', 'muted');
                blank();
            }

            async function catHistory() {
                if (historyLoading) return;
                historyLoading = true;
                const loading = document.createElement('div');
                loading.className = 'line muted';
                loading.textContent = 'reading history from github ...';
                out.appendChild(loading);
                try {
                    const data = await loadHistory();
                    loading.remove();
                    printHistory(data);
                } catch (err) {
                    loading.remove();
                    print('cat: history.md: ' + (err.message === 'rate'
                        ? "github says i asked too many times. try again in a bit."
                        : "couldn't reach github right now."), 'err');
                    print('<span class="muted">full history: github.com/' + esc(REPO) + '/commits</span>');
                }
                historyLoading = false;
                input.scrollIntoView({ block: 'nearest' });
            }

            function go(url, label) {
                print('<span class="muted">launching ' + esc(label) + ' ...</span>');
                setTimeout(() => { window.location.href = url; }, 450);
            }
            function openTab(url, label) {
                print('<span class="muted">opening ' + esc(label) + ' in a new tab ...</span>');
                window.open(url, '_blank', 'noopener');
            }

            // ---------- banner ----------
            function banner() {
                print('<span class="bright">altnskuur.github.io</span>');
                print('<span class="muted">---o---</span>');
                blank();
                print('selam, hello, hallo!');
                print('welcome to my playground.');
                blank();
                print("if you want the ui, type '" + cmdLink(UI_CMD) + "'.");
                print("if not, find your own way with '" + cmdLink(HELP_CMD) + "'.");
                blank();
            }

            // ---------- commands ----------
            const PAGES = ['stl', 'records', 'pickups', 'cv', 'say-hello'];

            const commands = {
                help() {
                    blank();
                    print('every page is a folder: cd, ls, cat and open (opens the folder in the ui) work everywhere.');
                    blank();
                    print('what do you wanna learn about me:');
                    blank();
                    const rows = [
                        [UI_CMD, "we're trying to build the best ui with claude!"],
                        ['hello-world', 'who am i? cd here and cat the files'],
                        ['stl', 'standard technical library: core, knowledge, today i learned'],
                        ['records', 'you can check out my adventures'],
                        ['pickups', 'some things i like to follow'],
                        ['cv', 'some formal stuff'],
                        ['say-hello', 'leave me a lovely message']
                    ];
                    rows.forEach(([c, d]) => print('<div class="help-row">' + cmdLink(c) + '<span class="muted">- ' + esc(d) + '</span></div>'));
                    blank();
                    print('<span class="muted">tip: ↑/↓ for history, tab to autocomplete.</span>');
                    blank();
                },
                ui() { go('portfolio.html', 'the ui'); },
                stl() { go('portfolio.html#stl', 'standard technical library'); },
                core() { go('portfolio.html#core', 'stl → core'); },
                knowledge() { go('portfolio.html#knowledge', 'stl → knowledge'); },
                til() { go('portfolio.html#til', 'stl → today i learned'); },
                records() { go('portfolio.html#records', 'records'); },
                pickups() { go('portfolio.html#pickups', 'pickups'); },
                'say-hello'() { go('portfolio.html#say-hello', "say 'hello altnskuur!'"); },
                links() { go('portfolio.html#links', 'pickups → links i liked'); },
                about() {
                    blank();
                    print('<span class="bright">uğur altınışık</span> — software engineer at meva avionics, ankara.');
                    print('i write firmware and embedded linux for things that fly.');
                    print('c, c++, linux, and way too many uart logs.');
                    print('off-screen: diving, basketball, tuesday football and new cities.');
                    blank();
                    print('<span class="muted">more in the ui →</span> ' + cmdLink(UI_CMD));
                    blank();
                },
                async ls(args) {
                    const arg = args[0] || '.';
                    let hit;
                    try { hit = await withLoading('reading ...', () => lookup(resolvePath(arg))); }
                    catch (e) { return print('ls: ' + LOAD_ERR, 'err'); }
                    if (!hit) return print('ls: cannot access ' + esc(arg) + ': no such file or directory', 'err');
                    if (hit.file !== undefined) return print(cmdLink(resolvePath(arg).pop()));
                    const names = entryNames(hit.dir).concat(resolvePath(arg).length ? [] : ['history.md']);
                    if (!names.length) return print('(empty for now. coming soon.)', 'muted');
                    print(names.map(n => '<span style="white-space:nowrap">' + (n.endsWith('/') ? '<span class="host">' + esc(n) + '</span>' : cmdLink(n)) + '</span>').join('    '));
                },
                async cat(args) {
                    if (!args[0]) return print("usage: cat <file>   (try: cd hello-world, then ls)", 'muted');
                    if (isHistory(args[0])) return catHistory();
                    let hit, text;
                    try {
                        hit = await withLoading('reading ...', () => lookup(resolvePath(args[0])));
                        if (hit && hit.file !== undefined) text = typeof hit.file === 'function' ? await withLoading('reading ...', hit.file) : hit.file;
                    } catch (e) { return print('cat: ' + LOAD_ERR, 'err'); }
                    if (!hit) return print('cat: ' + esc(args[0]) + ': no such file or directory', 'err');
                    if (hit.dir) return print('cat: ' + esc(args[0]) + ': is a directory. try cd ' + esc(args[0]), 'err');
                    printFile(text);
                },
                github() { openTab(LINKS.github, 'github'); },
                linkedin() { openTab(LINKS.linkedin, 'linkedin'); },
                email() {
                    print('<a href="' + LINKS.email + '">m.altinisiku@gmail.com</a> <span class="muted">— opening your mail app ...</span>');
                    window.location.href = LINKS.email;
                },
                whoami() { print('visitor. a curious one, apparently.'); },
                pwd() { print('/home/visitor' + (cwd === '~' ? '' : '/' + cwd)); },
                open(args) {
                    const parts = args[0] ? resolvePath(args[0]) : (cwd === '~' ? [] : cwd.split('/'));
                    const key = parts.join('/');
                    if (UI_OF[key] !== undefined) return go(UI_OF[key], key ? key.replace('/', ' → ') : 'the ui');
                    return null;     // not a folder: run() tries the old page names
                },
                date() { print(esc(new Date().toString())); },
                history() {
                    history.forEach((h, i) => print('<span class="muted">' + String(i + 1).padStart(4, ' ') + '</span>  ' + esc(h)));
                },
                clear() { out.innerHTML = ''; },
                home() { out.innerHTML = ''; banner(); },
                exit() { print('there is no exit. only ' + cmdLink(UI_CMD) + '.'); },
                sudo() { print('nice try. this incident will be reported (to nobody).', 'err'); },
                rm() { print("please don't. i just finished building this.", 'err'); }
            };
            // aliases
            [UI_CMD, './altnskuur.ui', 'altnskuur.ui', 'portfolio'].forEach(a => commands[a] = commands.ui);
            commands.cv = () => go('portfolio.html#cv', 'cv');
            commands['?'] = commands.help;
            commands['man'] = commands.help;
            commands['mail'] = commands.email;

            const COMPLETIONS = [UI_CMD, HELP_CMD, 'hello-world', 'stl', 'records', 'pickups', 'cv', 'say-hello', 'about', 'ls', 'github', 'linkedin', 'email', 'whoami', 'history', 'clear', 'sudo', 'portfolio'];

            function run(raw) {
                // accept commands typed with quotes too: '.\altnskuur.ui'
                const line = raw.trim().replace(/^(['"])(.*)\1$/, '$2').trim();
                echoPrompt(raw);
                if (!line) return;
                history.push(line);
                histIdx = history.length;

                const [name, ...args] = line.split(/\s+/);
                const key = name.toLowerCase();

                if (key === 'cd' || key === 'open') {
                    const arg = args[0] || '';
                    if (key === 'cd') {
                        const parts = resolvePath(arg || '~');
                        if (!parts.length) {
                            if (cwd === '~') return print('<span class="muted">you are already home.</span>');
                            misses = 0; return setCwd('~');
                        }
                        return withLoading('opening ...', () => lookup(parts)).then(hit => {
                            if (hit && hit.dir) {
                                misses = 0;
                                const before = cwd.split('/')[0];
                                setCwd(parts.join('/'));
                                // these pages are made for the ui: when you walk in, a hint first, then what's inside
                                if (UI_FIRST.includes(parts[0]) && before !== parts[0]) {
                                    print('for the best experience, switch to the ui.', 'muted');
                                    return commands.ls([]);
                                }
                                return;
                            }
                            if (hit) return print('bash: cd: ' + esc(arg) + ': not a directory. try cat ' + esc(arg), 'err');
                            if (['ui', 'portfolio', 'hello'].includes(arg.replace(/^[./\\]+/, '').toLowerCase())) { misses = 0; return commands.ui(); }
                            misses++;
                            print('bash: cd: ' + esc(arg) + ': no such file or directory' + (misses > 1 ? ". that's " + misses + ' misses in a row.' : ''), 'err');
                        }, () => print('cd: ' + LOAD_ERR, 'err'));
                    }
                    if (commands.open(args) !== null) { misses = 0; return; }
                    const target = arg.replace(/^[./\\]+/, '').replace(/\.html$/, '').toLowerCase();
                    if (PAGES.includes(target) || ['core', 'knowledge', 'til', 'links'].includes(target)) { misses = 0; return commands[target](); }
                    if (target === 'ui' || target === 'portfolio' || target === 'hello') { misses = 0; return commands.ui(); }
                    misses++;
                    return print('bash: ' + esc(key) + ': ' + esc(arg) + ': no such file or directory' + (misses > 1 ? ". that's " + misses + ' misses in a row.' : ''), 'err');
                }
                if (key === 'echo') return print(esc(args.join(' ')));
                if (key === 'terminal') {
                    if (['--help', '-h', 'help'].includes((args[0] || '').toLowerCase())) { misses = 0; return commands.help(); }
                    return print("usage: '" + cmdLink(HELP_CMD) + "'");
                }

                if (Object.prototype.hasOwnProperty.call(commands, key)) {
                    misses = 0;
                    return commands[key](args);
                }
                misses++;
                print('ups! come on, you can do this.', 'err');
            }

            // ---------- input handling ----------
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    const v = input.value;
                    input.value = '';
                    run(v);
                    input.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'ArrowUp') {
                    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
                    e.preventDefault();
                } else if (e.key === 'ArrowDown') {
                    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
                    else { histIdx = history.length; input.value = ''; }
                    e.preventDefault();
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    const v = input.value;
                    if (!v) return;
                    const words = v.split(' ');
                    let pool, last = words[words.length - 1].toLowerCase();
                    if (words.length > 1) {
                        const slash = last.lastIndexOf('/');
                        const base = slash >= 0 ? last.slice(0, slash + 1) : '';
                        const parts = resolvePath(base || '.');
                        const dir = peek(parts);
                        pool = dir ? entryNames(dir).concat(parts.length ? ['../'] : ['history.md']).map(n => base + n) : [];
                    }
                    else { pool = COMPLETIONS.concat(['cat', 'cd', 'pwd', 'open']); }
                    const hits = pool.filter(c => c.startsWith(last));
                    if (hits.length === 1) { words[words.length - 1] = hits[0]; input.value = words.join(' '); }
                    else if (hits.length > 1) { echoPrompt(input.value); print(hits.map(esc).join('    '), 'muted'); }
                } else if (e.key === 'l' && e.ctrlKey) {
                    e.preventDefault();
                    commands.clear();
                }
            });

            // click anywhere to focus the prompt (without breaking text selection)
            term.addEventListener('click', () => {
                if (!window.getSelection().toString()) input.focus();
            });

            banner();
            input.focus();
        })();
    </script>
</body>
