# Copies "Published" pages from the Notion Knowledge DB into knowledge/ and
# "Sended" pages from the Notion Feed DB into til/ and the Collection DB into
# collection/, commits them to main,
# then redeploys the site (only when something changed).
name: Sync Notion

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write             # commit the synced files
  actions: write              # start the deploy workflow afterwards

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull pages from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/notion_sync.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "notion-sync[bot]"
          git config user.email "notion-sync@users.noreply.github.com"
          git add knowledge til collection
          if git diff --cached --quiet; then
            echo "Nothing changed in Notion."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync from Notion"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # pushes made by this workflow don't start other workflows by themselves,
      # so start the Pages deploy explicitly
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
